{% if pager.pages > 1 %}<nav class="pager" aria-label="Страницы">{% if pager.prev %}<a class="btn" href="?{{ query }}page={{ pager.prev }}">← Назад</a>{% endif %}<span class="muted">Страница {{ pager.page }} из {{ pager.pages }} · всего {{ pager.total }}</span>{% if pager.next %}<a class="btn" href="?{{ query }}page={{ pager.next }}">Вперёд →</a>{% endif %}</nav>{% elif pager.total %}<p class="muted pager">Всего строк: {{ pager.total }}</p>{% endif %}
