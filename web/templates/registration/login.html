{% load static %}
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход · Registry Demo</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body class="login-body"><div class="login-panel">
  <div class="brand login-brand"><span class="brand-mark">R</span><span>Registry <small>Demo</small></span></div>
  <h1>Вход в систему</h1><p class="muted">Доступ к демонстрационным данным по выданным правам</p>
  {% if form.errors %}<p class="flash">Логин или пароль неверный.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label for="id_username">Логин</label><input id="id_username" type="text" name="username" autocomplete="username" required autofocus>
    <label for="id_password">Пароль</label><input id="id_password" type="password" name="password" autocomplete="current-password" required>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="btn primary full" type="submit">Войти</button>
  </form><p class="login-caption">Учётные записи создаются администратором. Публичной регистрации нет.</p>
</div></body></html>
